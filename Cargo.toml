[workspace]
resolver = "3"
members = ["crates/cockpit-core", "crates/cockpit-store", "crates/cockpit-ingest", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
cockpit-core = { path = "crates/cockpit-core" }
cockpit-store = { path = "crates/cockpit-store" }
cockpit-ingest = { path = "crates/cockpit-ingest" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
notify = "8.2"
# Sin `macos_fsevent` (el único rasgo por defecto): la app solo corre en Windows.
notify-debouncer-full = { version = "0.7", default-features = false }
file-id = "0.2"
ignore = "0.4"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
getrandom = "0.3"
tokio = { version = "1", features = ["rt", "net", "sync", "time"] }
criterion = { version = "0.8", default-features = false }

[workspace.lints.rust]
# `deny` y no `forbid`: el único uso permitido es el COM de WebView2 en src-tauri/src/procs.rs.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
